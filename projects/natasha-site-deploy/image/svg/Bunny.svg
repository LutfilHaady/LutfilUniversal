<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- lop ears (hang down the sides) -->
  <ellipse cx="58" cy="100" rx="19" ry="62" transform="rotate(16 58 100)" fill="#d8c3b0"/>
  <ellipse cx="142" cy="100" rx="19" ry="62" transform="rotate(-16 142 100)" fill="#d8c3b0"/>
  <ellipse cx="58" cy="100" rx="9.5" ry="46" transform="rotate(16 58 100)" fill="#f0dbe6"/>
  <ellipse cx="142" cy="100" rx="9.5" ry="46" transform="rotate(-16 142 100)" fill="#f0dbe6"/>
  <!-- body -->
  <ellipse cx="100" cy="166" rx="58" ry="52" fill="#d8c3b0"/>
  <!-- feet -->
  <ellipse cx="74" cy="208" rx="20" ry="13" fill="#cfb9a4"/>
  <ellipse cx="126" cy="208" rx="20" ry="13" fill="#cfb9a4"/>
  <!-- head -->
  <ellipse cx="100" cy="104" rx="48" ry="44" fill="#d8c3b0"/>
  <!-- arms hugging the cake -->
  <ellipse cx="66" cy="178" rx="15" ry="24" transform="rotate(26 66 178)" fill="#cfb9a4"/>
  <ellipse cx="134" cy="178" rx="15" ry="24" transform="rotate(-26 134 178)" fill="#cfb9a4"/>
  <!-- cheeks -->
  <circle cx="70" cy="116" r="10" fill="#f3b8d2" opacity="0.7"/>
  <circle cx="130" cy="116" r="10" fill="#f3b8d2" opacity="0.7"/>
  <!-- eyes -->
  <circle cx="82" cy="100" r="5.5" fill="#4a3329"/>
  <circle cx="118" cy="100" r="5.5" fill="#4a3329"/>
  <circle cx="84" cy="98" r="1.7" fill="#fff"/>
  <circle cx="120" cy="98" r="1.7" fill="#fff"/>
  <!-- nose + stitched smile -->
  <path d="M100 110l6 6h-12z" fill="#b87b95"/>
  <path d="M88 120q12 10 24 0" stroke="#9a7a64" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- cupcake -->
  <rect x="80" y="180" width="40" height="28" rx="5" fill="#fff3f8"/>
  <rect x="80" y="180" width="40" height="10" rx="5" fill="#f7d9e6"/>
  <path d="M80 190q10 8 20 0t20 0v3H80z" fill="#d168a0"/>
  <!-- candle -->
  <rect x="98" y="162" width="4" height="18" rx="2" fill="#d168a0"/>
  <path d="M100 154c4 4 4 9 0 10-4-1-4-6 0-10z" fill="#ffb347"/>
