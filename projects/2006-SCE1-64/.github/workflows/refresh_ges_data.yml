name: Refresh GES Data

on:
  schedule:
    #runs at 00:00 SGT on March 5th every year (UTC is 16:00 on March 4)
    - cron: "0 16 4 3 *"
  workflow_dispatch:  #Allows manual trigger too

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      #Step 1:Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      #Step 2:set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      #Step 3:install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests supabase


      #Step 4:run python script
      - name: Run GES data refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/backend/refresh_ges_data.py
