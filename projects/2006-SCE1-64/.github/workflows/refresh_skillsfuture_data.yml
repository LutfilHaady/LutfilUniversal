name: Monthly SkillsFuture Refresh

on:
  schedule:
    - cron: "0 0 1 * *"  # Runs at midnight on the 1st of every month (UTC)
  workflow_dispatch:      # Allows manual run

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv supabase

      - name: Run refresh script
        env:
          SF_SUPABASE_URL: ${{ secrets.SF_SUPABASE_URL }}
          SF_SUPABASE_SERVICE_KEY: ${{ secrets.SF_SUPABASE_SERVICE_KEY }}
        run: |
          python src/backend/refresh_skillsfuture_data.py
